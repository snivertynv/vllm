[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemma4-mtp-training-prototype"
version = "0.1.0"
description = "Standalone prototype for training Gemma 4 assistant checkpoints"
requires-python = ">=3.12"
dependencies = [
    "safetensors>=0.5.0",
    "torch>=2.7.0",
    "transformers>=5.8.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/gemma4_mtp_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

